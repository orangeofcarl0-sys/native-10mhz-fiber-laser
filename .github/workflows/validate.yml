name: CPU numerical checks
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python self_check.py
      - run: python validate_batch.py
      - run: python energy_budget.py
      - run: python -m unittest test_adaptive test_shared_gain test_spectral test_gain_age test_steady_state test_steady_preconditioner test_steady_hookstep test_steady_window test_steady_parameters test_steady_energy test_steady_support test_merit_geometry test_cauchy test_augmented_outer test_descent_sources test_active_history -v
      - run: python validate_edf_mesh.py
      - run: python validate_search_paths.py
